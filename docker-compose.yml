# Local stack: the API plus Postgres for the audit trail.
#
# The previous file hardcoded the database password, mounted the source tree
# into the container (`.:/app`), and carried an obsolete `version:` key.
# Secrets come from the environment (.env), and the image is used as built.

services:
  devops-os:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://devops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/devops_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: devops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
