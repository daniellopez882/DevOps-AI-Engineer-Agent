name: CI

# There was no pipeline and no test. The webhook accepted any caller and any
# trigger; the tools invented CI logs and CVEs; the audit log wrote a fixed
# confidence of 0.99 for every run.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Dry run must be the default
        # DRY_RUN off by default would let a model comment on GitHub and
        # change PagerDuty incidents on the first live event.
        run: |
          value=$(env -u DRY_RUN python -c "from config import settings; print(settings.DRY_RUN)")
          echo "DRY_RUN unset -> $value"
          [ "$value" = "True" ]

      - name: Boot the server and exercise the contract
        env:
          API_KEY: ci-test-key-not-real
          WEBHOOK_SECRET: ci-webhook-secret
          DATABASE_URL: sqlite:///./ci.db
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          set -x
          curl -fsS http://127.0.0.1:8000/health | grep -q '"dry_run":true'
          # no credentials -> 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/webhook \
                 -H 'Content-Type: application/json' -d '{"trigger_type":"manual"}')
          [ "$code" = "401" ]
          # unknown trigger -> 422, not "accepted"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/webhook \
                 -H 'X-API-Key: ci-test-key-not-real' -H 'Content-Type: application/json' \
                 -d '{"trigger_type":"nonsense"}')
          [ "$code" = "422" ]
          # a manual event with a key -> 202, then recorded as needs_human
          out=$(curl -sS -X POST http://127.0.0.1:8000/webhook \
                 -H 'X-API-Key: ci-test-key-not-real' -H 'Content-Type: application/json' \
                 -d '{"trigger_type":"manual"}')
          echo "$out"
          id=$(echo "$out" | python -c "import sys,json; print(json.load(sys.stdin)['event_id'])")
          sleep 2
          curl -sS http://127.0.0.1:8000/events/$id | grep -q '"status":"needs_human"'

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit
        run: bandit -r . -x ./tests,./.venv,./.venv312 -ll -f screen

      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # advisory feed availability, not a code defect

      - name: No credential or database file may be tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|\.db$' || true)
          if [ -n "$tracked" ]; then echo "$tracked"; echo "::error::a credential or data file is committed"; exit 1; fi
          echo "clean"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t devops-os:ci .

      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id devops-os:ci -u)
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: Production without an inbound secret must not start
        run: |
          set +e
          docker run --rm -e ENVIRONMENT=production -e WEBHOOK_SECRET= -e API_KEY= devops-os:ci
          code=$?
          set -e
          [ "$code" != "0" ] || { echo "::error::container started with an open webhook in production"; exit 1; }
          echo "refused with exit $code"

      - name: Serve and answer /health and /ready
        run: |
          docker run -d --name dv -p 8000:8000 -e API_KEY=ci-test-key-not-real devops-os:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -sS http://127.0.0.1:8000/ready
          echo
          docker logs dv | tail -10
          docker rm -f dv
