[project]
name = "devops-os"
version = "0.2.0"
description = "Routes CI/CD, review, incident and infrastructure events to specialist agents, in dry-run mode by default."
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` does not add the working directory to sys.path the way
# `python -m pytest` does; without this the conftest cannot import the app.
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv312", "devops_agent_prompts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["agent_graph", "config", "crew_agents", "database", "devops_agent_prompts", "llm", "main", "security", "tasks", "tools"]
